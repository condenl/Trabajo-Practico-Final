<text x="72" y="911" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#234d75"><tspan x="72" dy="0">Decisión presupuestaria</tspan></text>
<line x1="1252" y1="1023" x2="192" y2="1023" stroke="#315c8a" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="720" y="977" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="720" dy="0">Autorizar la compra o informar</tspan><tspan x="720" dy="24">observaciones</tspan></text>
<line x1="188" y1="1139" x2="888" y2="1139" stroke="#315c8a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="540" y="1093" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="540" dy="0">Emitir la orden aprobada o</tspan><tspan x="540" dy="24">renegociar condiciones</tspan></text>
<line x1="908" y1="1255" x2="1608" y2="1255" stroke="#315c8a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1260" y="1209" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="1260" dy="0">Despachar mercadería, remito y</tspan><tspan x="1260" dy="24">certificados</tspan></text>
