<text x="1260" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff"><tspan x="1260" dy="0">Equipo de Contabilidad</tspan></text>
<line x1="1260" y1="189" x2="1260" y2="2314" stroke="#91a4b7" stroke-width="2" stroke-dasharray="9 8"/>
