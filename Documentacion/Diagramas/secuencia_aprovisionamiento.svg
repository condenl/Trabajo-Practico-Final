<text x="1080" y="1325" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="1080" dy="0">Entregar lotes y documentación</tspan><tspan x="1080" dy="24">para control</tspan></text>
<path d="M 540 1477 h 95 v 42 h -95" fill="none" stroke="#315c8a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="587.5" y="1441" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="587.5" dy="0">Verificar cantidad, lote, origen</tspan><tspan x="587.5" dy="24">y vencimiento</tspan></text>
<rect x="48" y="1531" width="1704" height="46" rx="8" fill="#e8f0f7" stroke="#8aa4bd" stroke-width="1.5"/>
<text x="72" y="1561" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#234d75"><tspan x="72" dy="0">Si la mercadería es conforme</tspan></text>
<line x1="532" y1="1673" x2="192" y2="1673" stroke="#315c8a" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="360" y="1627" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="360" dy="0">Confirmar ingreso y actualizar</tspan><tspan x="360" dy="24">historial</tspan></text>
<line x1="1612" y1="1789" x2="1272" y2="1789" stroke="#315c8a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1440" y="1743" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="1440" dy="0">Remitir factura y conformidad de</tspan><tspan x="1440" dy="24">recepción</tspan></text>
<path d="M 1260 1895 h 95 v 42 h -95" fill="none" stroke="#315c8a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1307.5" y="1859" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="1307.5" dy="0">Registrar pasivo para</tspan><tspan x="1307.5" dy="24">liquidación</tspan></text>
<rect x="48" y="1949" width="1704" height="46" rx="8" fill="#e8f0f7" stroke="#8aa4bd" stroke-width="1.5"/>
<text x="72" y="1979" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#234d75"><tspan x="72" dy="0">Si el lote no es conforme</tspan></text>
<line x1="548" y1="2091" x2="888" y2="2091" stroke="#315c8a" stroke-width="3" marker-end="url(#arrow)"/>
<text x="720" y="2045" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="720" dy="0">Emitir reclamo o devolución</tspan></text>
<line x1="908" y1="2207" x2="1608" y2="2207" stroke="#315c8a" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<text x="1260" y="2161" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="500" fill="#172033"><tspan x="1260" dy="0">Coordinar reposición o nota de</tspan><tspan x="1260" dy="24">crédito</tspan></text>
</svg>