<text x="540" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff"><tspan x="540" dy="0">Responsable de</tspan><tspan x="540" dy="25">Inventario</tspan></text>
