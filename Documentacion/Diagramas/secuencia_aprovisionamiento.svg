      <path d="M0,0 L10,4 L0,8 z" fill="#315c8a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="900" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#14263d"><tspan x="900" dy="0">Aprovisionamiento, aprobación contable y trazabilidad</tspan></text>
